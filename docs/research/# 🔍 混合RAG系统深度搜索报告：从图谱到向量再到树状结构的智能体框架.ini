## 💡 实用建议与实施方案

### 推荐方案：Psi-RAG + KAG 模块组合

基于您需求的 **优先级排序** ，建议采用 **组合方案** 而非等待单一框架：

**Phase 1：基础框架搭建**
1. **核心引擎** ：Psi-RAG（层级树+智能体）[[103]](https://github.com/Newiz430/Psi-RAG)
   - 优势：ICML'26最新论文，架构先进，开源程度高
   - 待补充：知识图谱模块需自行集成

2. **知识图谱构建** ：KAG的kg-builder[[200]](https://github.com/OpenSPG/KAG)
   - 优势：生产级知识抽取，支持模式约束
   - 集成方式：将KAG抽取的三元组导入Neo4j

**Phase 2：向量检索增强**
3. **向量存储** ：Milvus或Weaviate
   - 嵌入模型：BGE-M3（支持中英文）
   - 混合检索：启用Psi-RAG的BM25+向量融合

**Phase 3：级联逻辑实现**
4. **自定义检索流水线** （需开发）：
```python
# 伪代码示例
def cascade_retrieval(query):
    # Stage 1: 知识图谱检索（使用KAG逻辑）
    kg_nodes = kg_solver.retrieve(query)  # 返回实体节点
    # Stage 2: 向量查询扩展（使用Psi-RAG）
    vector_context = hybrid_retriever.search_with_seeds(kg_nodes)
    # Stage 3: 树状结构导航
    tree_path = tree_traverser.navigate(vector_context)
    return tree_path
```

**Phase 4：后处理映射开发**
5. **GT-Link类似机制** （需参考BookRAG论文[[379]](https://arxiv.org/abs/2512.03413)自行实现）：
   - 实体→树节点：通过实体ID匹配树节点内容
   - 命中分布：统计各树节点检索命中次数，热力图可视化

### 备选方案：RAGFlow + 自定义扩展

**RAGFlow现状** [[321]](https://ragflow.io/docs/enable_raptor)：
- ✅ **已集成RAPTOR** ：TreeRAG技术作为可选模块
- ✅ **知识图谱支持** ：独立的图构建组件
- ❌ **非原生集成** ：树与图分离，无GT-Link映射
- ⚠️ **智能体能力** ：基础检索，无动态规划Agent

**扩展路径** ：
- 在RAGFlow基础上开发BookIndex类组件
- 集成Agent框架（如LangGraph）实现信息觅食策略

