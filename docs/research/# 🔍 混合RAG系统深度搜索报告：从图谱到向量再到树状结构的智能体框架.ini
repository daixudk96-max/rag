## 🔬 深度技术解析

### BookRAG架构创新点

**1. 版面层级树构建** [[100]](https://cloud.tencent.com/developer/article/2648534)[[102]](https://developer.aliyun.com/article/1716854)：
- 使用MinerU解析PDF，提取布局块（类型、字体、位置）
- LLM判定标题级别，按层级连接形成结构骨架
- 树节点包含内容块+元数据+父子关系

**2. 基于梯度的实体消解** ：
- 传统方法：成对比较O(n²)复杂度
- BookRAG方案：增量查找+评分模型+相似度陡降检测
- 优势：显著降低计算开销，保持图谱紧凑性

**3. GT-Link双向映射** [[102]](https://developer.aliyun.com/article/1716854)：
- 结构表示：B = (T, G, M)，其中T=树，G=知识图谱，M=映射关系
- 正向：实体→树节点（定位来源）
- 反向：树节点→实体上下文（富化检索）

**4. 信息觅食理论Agent** [[100]](https://cloud.tencent.com/developer/article/2648534)：
- 单跳查询：直接缩小范围，算子过滤→推理→排序
- 多跳查询：拆分子问题，分别检索后综合
- 全局聚合：范围过滤+模态过滤+Map-Reduce

### Psi-RAG性能突破

**层级抽象树构建** [[103]](https://github.com/Newiz430/Psi-RAG)[[248]](https://arxiv.org/abs/2605.00529)：
- **抽象策略** ：可选择摘要（Summary）或关键词（Keyword）作为节点内容
- **扩展能力** ：从段落级扩展到百万token语料库级
- **效率指标** ：2张RTX4090（48GB）可在<3小时完成>100万token索引
- **索引技术** ：支持分桶（Bucketing）+ HNSW近似检索，10M+ token极速排序

**多粒度检索流水线** [[103]](https://github.com/Newiz430/Psi-RAG)：
```
迭代智能体检索：跨文档多跳树搜索
    ↓
混合检索器：BM25 + 向量检索融合（RRF重排序）
    ↓
重排序器：自然语言重排序最大化结构化性能
```

**查询跳数判别器** [[103]](https://github.com/Newiz430/Psi-RAG)：
- 2层MLP轻量级网络
- 复用查询嵌入预测跳数
- 默认预训练，支持最多4跳
- 可设置`"max_retrieval_time": "auto"`

### KAG逻辑推理引擎

**kg-builder组件** [[200]](https://github.com/OpenSPG/KAG)：
- **DIKW层级升级** ：Data→Information→Knowledge→Wisdom
- **模式灵活** ：支持无模式（OpenIE式）与有模式（Schema约束）两种知识抽取
- **互索引表示** ：图结构 ↔ 文本块双向关联

**kg-solver组件** [[200]](https://github.com/OpenSPG/KAG)：
- **逻辑形式引导** ：自然语言问题 → 逻辑符号表示
- **混合求解** ：规划（Planning）+ 推理（Reasoning）+ 检索（Retrieval）
- **四类算子** ：检索、知识图谱推理、语言推理、数值计算

